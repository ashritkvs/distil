<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Distil</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" />
    <h1>Distil</h1>
  </header>

  <label class="row toggle-row">
    <span>Compress before sending</span>
    <input type="checkbox" id="enabled" />
  </label>
  <p class="hint">
    How much gets compressed is decided automatically — Distil trims as much
    filler as it safely can while keeping your meaning intact.
  </p>

  <div class="stats" id="stats" hidden>
    <div class="stats-title">Last compression</div>
    <div class="stats-row"><span id="statsSite"></span></div>
    <div class="stats-row"><span id="statsTokens"></span></div>
  </div>

  <div class="stats">
    <div class="stats-title">This browser, all time</div>
    <div class="stats-row"><span id="totalsRow">0 messages · 0 tokens saved</span></div>
  </div>

  <a class="dashboard-link" id="dashboardLink" href="https://getdistil.vercel.app" target="_blank" rel="noopener">
    View live metrics on getdistil.vercel.app ↗
  </a>

  <footer>
    <span id="siteList">claude.ai · chatgpt.com · gemini.google.com</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
