<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Distil</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" />
    <h1>Distil</h1>
  </header>

  <label class="row toggle-row">
    <span>Compress before sending</span>
    <input type="checkbox" id="enabled" />
  </label>

  <label class="row">
    <span>Compression ratio: <b id="ratioValue">50%</b> of tokens kept</span>
    <input type="range" id="ratio" min="0.2" max="0.9" step="0.05" />
  </label>
  <p class="hint">Lower = more compression, more terse. Higher = closer to your original wording.</p>

  <div class="stats" id="stats" hidden>
    <div class="stats-title">Last compression</div>
    <div class="stats-row"><span id="statsSite"></span></div>
    <div class="stats-row"><span id="statsTokens"></span></div>
  </div>

  <footer>
    <span id="siteList">claude.ai · chatgpt.com · gemini.google.com</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
